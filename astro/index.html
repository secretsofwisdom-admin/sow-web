<!DOCTYPE html>
<html>
<head>
  <!-- Replaced by the value of `flutter build --base-href=`. Must be written
       with an `=`: with a space, Flutter 3.44 silently leaves it "/" and every
       asset 404s under /astro/. -->
  <base href="/astro/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Western natal chart calculator — placements, houses, aspects, transits and synastry.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Natal Chart">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Natal Chart · Secrets of Wisdom</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* The page behind the canvas, so the first paint is the chart's own
       ground rather than a white flash inside the site's dark iframe. */
    html, body { margin: 0; padding: 0; height: 100%; background: #12100E; }

    /* Flutter's engine sets `touch-action: none` on <body> at startup, which
       is one of the two things that stop a touchscreen pinch-zoom (a
       trackpad pinch is blocked elsewhere; see the wheel listener below):
       touch-action applies to the element under the fingers, and this iframe
       is full-bleed, so it swallows the gesture for the whole page.

       `pinch-zoom` hands the browser two-finger pinch and nothing else, so
       every single-pointer gesture still reaches Flutter and the app's own
       scrolling, dragging and tapping are untouched.

       !important is load-bearing: the engine's rule is an inline style, and an
       author !important declaration is the one thing that outranks it. */
    body { touch-action: pinch-zoom !important; }
  </style>

  <!-- Third piece of the zoom fix, this one for pointing devices.

       A trackpad pinch is not a touch gesture — Chrome and Firefox deliver it
       as a wheel event carrying ctrlKey — so the touch-action rule above does
       nothing for it. The engine registers a NON-PASSIVE wheel listener on
       <flutter-view> and preventDefaults every wheel event it sees (`ai_` in
       main.dart.js). That branch is taken whenever the app is framed and owns
       its whole document, which is exactly how the site embeds it, so the
       browser's own zoom was being cancelled on every pinch.

       Stopping the event during the capture phase on window keeps it away from
       that listener, which sits on a descendant, so nothing cancels it and the
       browser zooms. Do NOT call preventDefault here: that would kill the zoom
       just as surely as Flutter did.

       Only ctrlKey events are diverted, so ordinary two-finger scrolling still
       reaches Flutter and the app's own scrolling is untouched. -->
  <script>
    addEventListener('wheel', function (e) {
      if (e.ctrlKey) e.stopPropagation();
    }, {capture: true});
  </script>
</head>
<body>
  <!-- astronomy-engine (Don Cross, MIT), vendored rather than bundled: this
       project has no JS build step. Its UMD wrapper assigns window.Astronomy,
       which is what `@JS('Astronomy')` in lib/astronomy/engine_web.dart binds
       to. Loaded synchronously and before the bootstrap so the namespace is
       already there when the first chart is cast. -->
  <script src="astronomy.browser.min.js"></script>

  <script src="flutter_bootstrap.js" async></script>

  <!-- The other half of the pinch-zoom fix.

       Flutter's engine deletes *every* author <meta name="viewport"> in the
       head at startup and appends its own, carrying
       `maximum-scale=1.0, user-scalable=no` (see `a4q()` in main.dart.js). So
       declaring a zoomable viewport above would simply be thrown away, and the
       correction has to land after the engine has had its turn.

       The bootstrap is async, so this runs first and the tag does not exist
       yet; the observer catches the engine appending it. It is left connected
       rather than disconnected on first success — writing `content` is an
       attribute change and cannot re-trigger a childList observer, so there is
       no loop to guard against, and a future engine that rewrites the tag
       twice is handled for free. -->
  <script>
    (function () {
      var wanted = 'width=device-width, initial-scale=1.0, ' +
                   'minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes';
      function restore() {
        var meta = document.head.querySelector('meta[name="viewport"]');
        if (meta && meta.content !== wanted) meta.content = wanted;
      }
      restore();
      new MutationObserver(restore).observe(document.head, {childList: true});
    })();
  </script>
</body>
</html>
