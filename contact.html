<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secrets of Wisdom · NZ – Energy Harmony and Destiny Flow</title>
  <link rel="icon" type="image/png" href="images/celestial-center.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script defer src="lang-switcher.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo"><img src="images/celestial-center.jpg" alt="Secrets of Wisdom logo" /></a>
  <a href="index.html" data-i18n="nav.home">Home</a>
  <a href="posts.html" data-i18n="nav.posts">Posts</a>
  <a href="about.html" data-i18n="nav.about">About</a>
  <a href="services.html" data-i18n="nav.services">Services</a>
  <a href="contact.html" data-i18n="nav.contact">Contact</a>
  <select class="lang-select" aria-label="Language">
    <option value="en" selected>EN</option>
    <option value="ru">RU</option>
  </select>
</nav>
<header>
  <h1 data-i18n="contact.heading">Connect with Me</h1>
  <p data-i18n="contact.subtitle">Begin Your Harmony Journey</p>
</header>
<section class="fade-up">
  <p data-i18n="contact.intro">Feel free to reach out for consultations, collaborations, or questions.</p>
  <form id="contact-form" class="fade-up">
    <label data-i18n="contact.labelName">Name</label><br/>
    <input type="text" name="name" required /><br/>
    <label data-i18n="contact.labelEmail">Email</label><br/>
    <input type="email" name="email" required /><br/>
    <label data-i18n="contact.labelMessage">Message</label><br/>
    <textarea name="message" required></textarea><br/>
    <button type="submit" data-i18n="contact.btnSend">Send</button>
    <p id="form-status"></p>
  </form>
  <script>
    window.sowFormText = { send: 'Send', sending: 'Sending...', error: 'Failed to send. Please try again.' };
    document.getElementById('contact-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const t = window.sowFormText;
      const btn = e.target.querySelector('button');
      const status = document.getElementById('form-status');
      btn.disabled = true;
      btn.textContent = t.sending;
      status.textContent = '';
      try {
        const res = await fetch('/api/contact', { method: 'POST', body: new FormData(e.target) });
        const data = await res.json();
        if (res.ok) {
          window.location.href = 'thank-you.html';
          return;
        } else {
          status.style.color = '#FF6B6B';
          status.textContent = data.error || t.error;
        }
      } catch {
        status.style.color = '#FF6B6B';
        status.textContent = t.error;
      }
      btn.disabled = false;
      btn.textContent = t.send;
    });
  </script>
</section>
<footer data-i18n="footer">© 2026 Secrets of Wisdom · NZ – Energy Harmony and Destiny Flow</footer>
</body>
</html>
